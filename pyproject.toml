[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-fatigue-classification"
version = "0.1.0"
description = "Auditable offline binary sEMG classification with explicit weak labels"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "PyWavelets", "matplotlib", "joblib", "PyYAML", "pyarrow", "requests==2.34.2"]

[project.optional-dependencies]
raw-first-ssl = ["torch==2.12.1"]

[project.scripts]
emg-fatigue = "emg_fatigue.cli:main"
emg-fatigue-raw-first = "emg_fatigue.raw_first.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
